# Keeps the GitHub Actions and Python packages this repo uses up to date. Dependabot opens a pull request each
# month, and the Checks workflow redraws every chart with the new versions before anything is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Update"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Update"
