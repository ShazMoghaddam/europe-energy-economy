name: Refresh data

# Eurostat, FRED and Our World in Data each publish on their own timetable. This checks once a week and, if
# anything changed, opens a pull request with the new data, redrawn charts and an updated report, ready to
# review and merge. Nothing is pushed to main directly.
#
# Company profits, the timeline of events and the figures in data/facts.json are checked by hand, so they
# never change here.
on:
  schedule:
    - cron: "23 8 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Download the latest figures
        run: python data/fetch.py
      - name: See whether any figures changed
        id: changed
        # sources.json always changes because it records when the download ran, so only the data files count.
        run: |
          if git diff --quiet -- 'data/*.csv'; then echo "data=no" >> "$GITHUB_OUTPUT"; else echo "data=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Redraw charts and rewrite the report
        if: steps.changed.outputs.data == 'yes'
        run: python findings/build.py
      - name: Check the results
        if: steps.changed.outputs.data == 'yes'
        run: pytest -q
      - name: Find the latest month
        if: steps.changed.outputs.data == 'yes'
        id: period
        run: echo "label=$(python -c "import json; print(json.load(open('data/sources.json'))['files']['world_prices.csv']['last'])")" >> "$GITHUB_OUTPUT"
      - name: Open a pull request if anything changed
        if: steps.changed.outputs.data == 'yes'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: data/refresh
          delete-branch: true
          add-paths: |
            data/*.csv
            data/sources.json
            charts/*.svg
            findings/README.md
            README.md
          commit-message: "Update data and charts to ${{ steps.period.outputs.label }}"
          title: "Update data and charts to ${{ steps.period.outputs.label }}"
          body: |
            New figures from Eurostat, FRED and Our World in Data. This pull request was opened automatically by the **Refresh data** workflow.

            - Downloaded the latest data with `data/fetch.py`
            - Redrew every chart, rewrote the [State of Europe's energy](findings/README.md) report and refreshed the key findings in the README with `findings/build.py`
            - Ran the checks in `tests/`

            Have a quick look at the report and charts, then merge. If a new event has moved prices, add it to `data/timeline.csv` by hand.
          labels: data
