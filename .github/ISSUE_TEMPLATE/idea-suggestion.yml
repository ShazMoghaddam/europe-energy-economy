name: Idea suggestion
description: Suggest a question or dataset about energy and the economy
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: What would you like to find out about energy and the economy?
      placeholder: e.g. Did countries with more wind power see smaller rises in electricity bills?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to useful data (if you know one)
      placeholder: https://
  - type: input
    id: publisher
    attributes:
      label: Who publishes it?
      placeholder: e.g. Eurostat, Ember, IEA, ENTSO-E, a national statistics office
  - type: checkboxes
    id: checks
    attributes:
      label: Checks (if you've suggested data)
      options:
        - label: It's free and openly licensed (e.g. CC BY 4.0)
        - label: It can be downloaded without an account
        - label: It opens on a normal laptop
